name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  check:
    name: Check workspace
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: TypeScript and Rust check
        run: npm run check

      - name: Rust tests
        run: npm run test

      - name: Studio frontend build
        run: npm --workspace @strut/studio run build
