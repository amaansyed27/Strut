[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "strut-python"
version = "0.1.0"
description = "Sprite and vector authoring helpers that emit validated Strut generation plans and operations."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]

