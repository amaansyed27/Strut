[workspace]
resolver = "2"
members = [
  "apps/studio/src-tauri",
  "crates/strut-agent",
  "crates/strut-core",
  "crates/strut-format",
  "crates/strut-renderer",
  "crates/strut-verifier",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/strut/strut"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
